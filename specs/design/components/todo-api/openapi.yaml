openapi: 3.0.3
info:
  title: Todo API
  version: 0.1.0
  description: Manages todo lists, todo items, and list sharing/collaboration.
servers:
  - url: /

paths:
  /todo-lists:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listTodoLists
      summary: List the caller's own and shared todo lists
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [own, shared, all], default: all }
          description: filter to lists the caller owns, lists shared with them, or all
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: matching lists
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TodoList' }
        '401':
          description: caller is not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createTodoList
      summary: Create a new todo list owned by the caller
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoListInput' }
      responses:
        '201':
          description: list created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '400':
          description: invalid list name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: caller is not signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /todo-lists/{listId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: getTodoList
      summary: Get one todo list the caller owns or collaborates on
      responses:
        '200':
          description: the list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '404':
          description: list not found or not visible to the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      operationId: updateTodoList
      summary: Rename a list (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoListInput' }
      responses:
        '200':
          description: updated list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoList' }
        '400':
          description: invalid list name
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not the list owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: list not found or not visible to the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteTodoList
      summary: Delete a list (owner only)
      responses:
        '204':
          description: list deleted
        '403':
          description: caller is not the list owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: list not found or not visible to the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /todo-lists/{listId}/todo-items:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listTodoItems
      summary: List a list's todo items, sorted by due date
      parameters:
        - name: completed
          in: query
          schema: { type: boolean }
          description: filter by completion state
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: matching items
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TodoItem' }
        '404':
          description: list not found or not visible to the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: createTodoItem
      summary: Add a todo item to a list
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoItemInput' }
      responses:
        '201':
          description: item created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoItem' }
        '400':
          description: invalid item text or due date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: list not found or not visible to the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /todo-lists/{listId}/todo-items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/ItemId'
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: updateTodoItem
      summary: Edit a todo item's text, due date, or completion state
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TodoItemUpdate' }
      responses:
        '200':
          description: updated item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TodoItem' }
        '400':
          description: invalid item text or due date
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: list or item not found or not visible to the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteTodoItem
      summary: Delete a todo item
      responses:
        '204':
          description: item deleted
        '404':
          description: list or item not found or not visible to the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /todo-lists/{listId}/collaborators:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/UserId'
    get:
      operationId: listCollaborators
      summary: List the users a list is shared with (owner or collaborator)
      responses:
        '200':
          description: collaborators
          content:
            application/json:
              schema:
                type: object
                required: [count, data]
                properties:
                  count: { type: integer, description: total matching items }
                  next: { type: string, nullable: true, description: relative URI of the next page }
                  previous: { type: string, nullable: true, description: relative URI of the previous page }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Collaborator' }
        '404':
          description: list not found or not visible to the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      operationId: addCollaborator
      summary: Share a list with another user (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CollaboratorInput' }
      responses:
        '201':
          description: collaborator added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collaborator' }
        '400':
          description: invalid or unknown user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: caller is not the list owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: list not found or not visible to the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /todo-lists/{listId}/collaborators/{userId}:
    parameters:
      - $ref: '#/components/parameters/ListId'
      - $ref: '#/components/parameters/UserId'
      - name: userId
        in: path
        required: true
        description: id of the collaborator to remove, or "me" for the caller to leave
        schema: { type: string }
    delete:
      operationId: removeCollaborator
      summary: Remove a collaborator (owner), or leave a shared list (collaborator, via "me")
      responses:
        '204':
          description: collaborator removed
        '403':
          description: caller may not remove this collaborator
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: list or collaborator not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    UserId:
      name: X-User-Id
      in: header
      required: true
      description: caller identity injected by the gateway from the validated token
      schema: { type: string }
    ListId:
      name: listId
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: HTTP or application error code }
        message: { type: string, description: short human-readable label }
        description: { type: string, description: detailed explanation }
        moreInfo: { type: string, description: URI to documentation }

    TodoList:
      type: object
      required: [id, name, ownerId, isOwner, openItemCount, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        ownerId: { type: string }
        isOwner: { type: boolean, description: whether the caller owns this list }
        openItemCount: { type: integer, description: number of incomplete items }
        createdAt: { type: string, format: date-time }

    TodoListInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }

    TodoItem:
      type: object
      required: [id, listId, text, completed, createdAt, updatedAt]
      properties:
        id: { type: string }
        listId: { type: string }
        text: { type: string }
        dueDate: { type: string, format: date, nullable: true }
        completed: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TodoItemInput:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
        dueDate: { type: string, format: date, nullable: true }

    TodoItemUpdate:
      type: object
      properties:
        text: { type: string, minLength: 1, maxLength: 500 }
        dueDate: { type: string, format: date, nullable: true }
        completed: { type: boolean }

    Collaborator:
      type: object
      required: [userId, addedAt]
      properties:
        userId: { type: string }
        displayName: { type: string }
        addedAt: { type: string, format: date-time }

    CollaboratorInput:
      type: object
      required: [userId]
      properties:
        userId: { type: string, description: id or username of the user to add as collaborator }
